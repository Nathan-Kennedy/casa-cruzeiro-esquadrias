<style>
[hidden]{display:none!important}
:root{--preto:#0d0d0f;--preto2:#16161a;--ouro:#c9a64b;--ouro2:#a8842c;--creme:#fbfaf7;--linha:#e8e3d8;--txt:#1d1c1a;--cinza:#6b665e;
  --r:14px;--sombra:0 10px 30px rgba(20,18,12,.10),0 2px 6px rgba(20,18,12,.06);--top:64px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--creme);color:var(--txt);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{display:grid;overflow:hidden;max-width:100vw;grid-template-columns:272px minmax(0,1fr) 384px;grid-template-rows:var(--top) 1fr;height:100dvh}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--preto);color:#fff;position:relative;z-index:5}
header img{height:34px;width:34px;object-fit:contain}
.marca{display:flex;flex-direction:column;line-height:1.1}
.marca b{letter-spacing:.18em;font-size:13px}.marca small{color:#b9b4a9;font-size:11px;letter-spacing:.04em}
.titulo{margin-left:10px;padding-left:16px;border-left:1px solid #2b2b31}
.titulo h1{font-size:16px;font-weight:600;letter-spacing:.01em}.titulo p{font-size:12px;color:#b9b4a9}
.top-acoes{margin-left:auto;display:flex;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid #33333a;color:#eee;display:inline-flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;transition:.2s}
.chip:hover{border-color:var(--ouro);color:#fff}.chip.off{opacity:.5}
.chip.ouro{background:var(--ouro);border-color:var(--ouro);color:#111;font-weight:600}
aside{grid-row:2;border-right:1px solid var(--linha);background:#fff;overflow:auto;padding:14px 12px}
aside h3,.sec h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza);margin:4px 6px 10px;font-weight:600}
#lista{display:flex;flex-direction:column;gap:6px}
.card{display:flex;align-items:center;gap:12px;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;transition:.18s}
.card:hover{background:#f6f3ec}.card.on{background:#fbf6e8;border-color:#ead9a6}
.cod{min-width:42px;height:42px;border-radius:11px;background:var(--preto);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.02em}
.card.on .cod{background:var(--ouro);color:#111}
.card .txt{display:flex;flex-direction:column}.card b{font-size:14px;font-weight:600}.card small{color:var(--cinza);font-size:12px}
main{grid-row:2;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#ffffff 0%,#f3f1ec 55%,#ebe7df 100%)}
#stage{position:absolute;inset:0}
#stage canvas{display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{pointer-events:auto;font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(13,13,15,.86);color:#fff;box-shadow:var(--sombra);transition:.2s;letter-spacing:.03em}
.tag:hover{background:#000}.tag.on{background:var(--ouro);color:#111;transform:scale(1.12)}
.cota{font:600 12px/1 "Segoe UI",system-ui,sans-serif;color:#7d6322;background:rgba(255,255,255,.88);padding:3px 6px;border-radius:6px;white-space:nowrap}
.escala{font-size:11px;color:var(--cinza);background:rgba(255,255,255,.8);padding:2px 6px;border-radius:6px}
.dica{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(13,13,15,.78);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:999px;pointer-events:none;backdrop-filter:blur(6px);white-space:nowrap}
#cores{position:absolute;right:14px;top:14px;width:282px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra);padding:14px;display:none;z-index:3}
#cores.aberto{display:block}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.sel button{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:1px solid var(--linha);font-size:13px;text-align:left;transition:.15s}
.sel button:hover{border-color:#cfc6b2}.sel button.on{border-color:var(--ouro);background:#fbf6e8;font-weight:600}
.sel i{width:22px;height:22px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
#acab-nota{font-size:12px;color:var(--cinza);margin:-4px 2px 0}
#painel{grid-row:2;min-width:0;background:#fff;border-left:1px solid var(--linha);overflow:auto;padding:18px 18px 10px}
.alca{display:none}
.cab{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.cab .cod{min-width:52px;height:52px;font-size:17px;background:var(--ouro);color:#111}
.cab h2{font-size:18px;line-height:1.25;font-weight:650}.sub{color:var(--cinza);font-size:13px;margin-top:2px}
.medidas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.medidas div{background:#f7f4ee;border-radius:12px;padding:10px;text-align:center}
.medidas b{display:block;font-size:20px;font-weight:700}.medidas span{font-size:11.5px;color:var(--cinza)}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.acoes button{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--linha);font-size:14px;font-weight:600;transition:.15s}
.acoes button:hover{border-color:#cfc6b2}
.acoes .prim{background:var(--preto);border-color:var(--preto);color:#fff;min-width:110px}.acoes .prim:hover{background:#000}
.paredes{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;color:var(--cinza)}
.paredes span{display:flex;align-items:center;gap:8px}.paredes i{width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
dl{border-top:1px solid var(--linha)}
.lin{display:grid;grid-template-columns:104px minmax(0,1fr);overflow-wrap:anywhere;gap:10px;padding:10px 2px;border-bottom:1px solid var(--linha);font-size:13.5px}
dt{color:var(--cinza);font-size:12.5px}dd{color:var(--txt)}
.pend{display:inline-block;background:#fff3d6;color:#7d5a00;border-radius:6px;padding:0 6px;font-size:12px;font-weight:600}
.intro h2{font-size:20px;margin-bottom:8px}.intro p{color:#3b3933;margin-bottom:10px}
.intro ul{list-style:none;margin:12px 0}.intro li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--linha);font-size:14px}
.intro li b{min-width:22px;height:22px;border-radius:50%;background:var(--preto);color:#fff;display:grid;place-items:center;font-size:12px}
.rodape{margin-top:18px;padding-top:14px;border-top:1px solid var(--linha);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--cinza)}
.rodape img{width:26px;height:26px}.rodape a{color:var(--ouro2);font-weight:600;text-decoration:none}
.aviso{font-size:11.5px;color:var(--cinza);margin-top:8px}
#carregando{position:fixed;inset:0;background:var(--creme);display:grid;place-items:center;z-index:20;font-size:14px;color:var(--cinza)}
@media (max-width:1100px){.app{grid-template-columns:240px minmax(0,1fr) 340px}}
@media (max-width:560px){.marca{display:none}.titulo{border:0;padding-left:0}}
@media (max-width:860px){
  :root{--top:56px;--peek:300px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) auto 1fr}
  aside,main,header{min-width:0}#b-tudo{display:none}.top-acoes{gap:6px}
  header{padding:0 10px;gap:8px}.marca b{font-size:11px;letter-spacing:.12em}.titulo{margin-left:0;padding-left:10px}.titulo p,.marca small{display:none}.titulo h1{font-size:14px}
  .top-acoes .chip span{display:none}.top-acoes .chip{padding:0 11px}
  aside{grid-row:2;border:0;border-bottom:1px solid var(--linha);padding:8px 10px;overflow-x:auto;overflow-y:hidden}
  aside h3{display:none}#lista{flex-direction:row;gap:6px}
  .card{padding:6px 10px 6px 6px;border:1px solid var(--linha);white-space:nowrap}.card .cod{min-width:34px;height:34px;font-size:13px}.card small{display:none}.card b{font-size:13px}
  main{grid-row:3}
  #painel{position:fixed;left:0;right:0;width:100vw;max-width:100vw;bottom:0;max-height:58dvh;border:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.14);padding:8px 16px calc(12px + env(safe-area-inset-bottom));
    transform:translateY(calc(100% - 128px));transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:6}
  #painel.aberto{transform:translateY(calc(100% - var(--peek)))}
  #painel.expandido{transform:none}
  #painel:not(.expandido){overflow:hidden}
  .alca{display:block;width:56px;height:6px;border-radius:9px;background:#d8d1c2;margin:2px auto 10px;padding:10px 0;background-clip:content-box;cursor:grab}
  .dica{bottom:140px;font-size:12px}
  #cores{left:10px;right:10px;width:auto;top:10px}
}
</style>
</head>

  <div class="intro">
    <h2>Esquadrias da Casa Cruzeiro</h2>
    <p>Cada porta, janela e o portão estão numa parede de 3,00 m, a altura do pé-direito da casa. Cada trecho de parede tem a cor da parede onde a esquadria fica, e as medidas são as do projeto.</p>
    <ul>
      <li><b>1</b><span>Escolha uma esquadria na lista ou toque nela.</span></li>
      <li><b>2</b><span>Use <strong>Abrir</strong> para ver como ela funciona.</span></li>
      <li><b>3</b><span>Veja o outro lado da parede e as medidas.</span></li>
      <li><b>4</b><span>Em <strong>Cores</strong>, compare as paletas da fachada e as cores de alumínio.</span></li>
    </ul>
    <p class="aviso">A pessoa ao lado da parede tem 1,70 m, para dar a escala. Imagens ilustrativas: confira o quadro de esquadrias antes de orçar ou fabricar.</p>
